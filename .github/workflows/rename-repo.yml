name: Rename Repository

description: >
  Renames the repository from mac-diablo-helper to diablo-helper and updates every
  reference. GitHub keeps a redirect from the old path, so existing clone URLs and
  README download links continue to resolve.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "rename" to confirm'
        required: true
        type: string

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest

    steps:
      - name: Guard
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "rename" ]; then
            echo "Refusing to run: expected confirmation, got '$CONFIRM'"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Rename via the API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            repos/${{ github.repository }} \
            -f name=diablo-helper \
            -f description='Native precision gaming helper for Diablo 3 & 4 — macOS and Windows 11 (KO/EN)' \
            --jq '.full_name'

      - name: Update references in the docs
        run: |
          set -euo pipefail

          # Markdown and workflow files only. Source code has no hardcoded URL.
          grep -rl 'esketch-ai/mac-diablo-helper' --include='*.md' --include='*.yml' --include='*.yaml' . \
            | while read -r f; do
              sed -i '' 's|esketch-ai/mac-diablo-helper|esketch-ai/diablo-helper|g' "$f" 2>/dev/null \
                || sed -i 's|esketch-ai/mac-diablo-helper|esketch-ai/diablo-helper|g' "$f"
              echo "updated $f"
            done

      - name: Commit and push
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no references needed changing"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: rename repository to diablo-helper and update links'
          git push
