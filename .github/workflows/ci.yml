name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancel superseded runs so a burst of pushes does not queue five identical builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # Core tests run on every push, on both operating systems.
  #
  # The core library is deliberately net8.0 (not net8.0-windows) so the domain logic and
  # the Win32 interop marshalling are testable from any host. Running it on both proves
  # that claim is still true, and catches anything that accidentally depends on a
  # Windows-only default.
  # ---------------------------------------------------------------------------
  tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore win/tests/DM_Helper.Core.Tests/DM_Helper.Core.Tests.csproj

      - name: Test
        run: dotnet test win/tests/DM_Helper.Core.Tests/DM_Helper.Core.Tests.csproj --no-restore -c Release --logger "trx;LogFileName=results.trx" --results-directory "${{ github.workspace }}/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/**/*.trx
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Windows app build. Publishes an artifact but does NOT release: the binary is
  # unusable until the Phase 0 spike confirms SendInput and the low-level hooks reach
  # Diablo 4. See win/README.md.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single file
        # Absolute output paths: a working-directory would make this step resolve out/app
        # relative to win/, while later steps run from the repository root.
        run: dotnet publish win/src/DM_Helper.Wpf/DM_Helper.Wpf.csproj -c Release -r win-x64 --nologo -o "$env:GITHUB_WORKSPACE/win/out/app"

      - name: Publish the Phase 0 verification tool
        run: dotnet publish win/src/DM_Helper.Spike/DM_Helper.Spike.csproj -c Release -r win-x64 --self-contained false --nologo -o "$env:GITHUB_WORKSPACE/win/out/spike"

      - name: Verify the manifest reached the binary
        # A build can silently drop app.manifest, leaving the app unelevated and every
        # SendInput call quietly blocked by UIPI. Assert on the published exe.
        #
        # Paths are absolute because this step runs from the repository root while the
        # publish step targets a directory under win/.
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "win/out/app/DM_Helper.exe"
          if (-not (Test-Path $exe)) { throw "DM_Helper.exe was not produced at $exe" }

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text  = [System.Text.Encoding]::UTF8.GetString($bytes)

          foreach ($needle in @('requireAdministrator', 'PerMonitorV2')) {
            if (-not $text.Contains($needle)) {
              throw "manifest entry '$needle' is missing from the published exe - elevation or DPI awareness was dropped"
            }
          }

          Write-Host "manifest verified: requireAdministrator + PerMonitorV2 present"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: dm-helper-windows-x64
          path: ${{ env.GITHUB_WORKSPACE }}/win/out/app/**
          retention-days: 30

      - name: Upload verification tool
        uses: actions/upload-artifact@v4
        with:
          name: dm-helper-spike-windows-x64
          path: ${{ env.GITHUB_WORKSPACE }}/win/out/spike/**
          retention-days: 30

  # ---------------------------------------------------------------------------
  # macOS app build. Codesign and notarization are deliberately out of scope: the
  # published .app must be produced on a Mac holding the signing identity, which this
  # runner does not have. This job proves the ObjC still compiles.
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Build the Objective-C target
        # -scheme "DM_Helper" rather than -target d3key: xcodebuild refuses -derivedDataPath
        # without one of -scheme/-testProductsPath/-xctestrun, and without an explicit
        # output path the .app lands somewhere version dependent and unsearchable.
        # The scheme name comes from the product name (DM_Helper in the pbxproj) because the
        # repository has no shared .xcscheme; xcodebuild autocreates one from the target.
        #
        # No signing: a CI-signed build would not be distributable anyway, and it would
        # produce an artifact that differs from the released one in a confusing way.
        run: |
          set -euo pipefail
          xcodebuild \
            -project "D3 Skill Assistant.xcodeproj" \
            -scheme "DM_Helper" \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate the built app
        id: app
        run: |
          set -euo pipefail
          # The Release products dir is deterministic given -derivedDataPath, but search
          # anyway so an Xcode layout change does not silently skip the upload.
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "DM_Helper.app" -type d 2>/dev/null | head -1 || true)

          if [ -z "$APP" ]; then
            echo "::error::DM_Helper.app was not produced under $RUNNER_TEMP/dd/Build/Products"
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 2 -type d || true
            exit 1
          fi

          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "found $APP"

      - name: Upload macOS build (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: dm-helper-macos-unsigned
          path: ${{ steps.app.outputs.path }}
          retention-days: 30
