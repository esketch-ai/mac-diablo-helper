name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Cancel superseded runs so a burst of pushes does not queue five identical builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ---------------------------------------------------------------------------
  # Core tests run on every push, on both operating systems.
  #
  # The core library is deliberately net8.0 (not net8.0-windows) so the domain logic and
  # the Win32 interop marshalling are testable from any host. Running it on both proves
  # that claim is still true, and catches anything that accidentally depends on a
  # Windows-only default.
  # ---------------------------------------------------------------------------
  tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: win
        run: dotnet restore tests/DM_Helper.Core.Tests/DM_Helper.Core.Tests.csproj

      - name: Test
        working-directory: win
        run: dotnet test tests/DM_Helper.Core.Tests/DM_Helper.Core.Tests.csproj --no-restore -c Release --logger "trx;LogFileName=results.trx" --results-directory "${{ github.workspace }}/test-results"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/**/*.trx
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Windows app build. Publishes an artifact but does NOT release: the binary is
  # unusable until the Phase 0 spike confirms SendInput and the low-level hooks reach
  # Diablo 4. See win/README.md.
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows app
    runs-on: windows-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single file
        working-directory: win
        run: dotnet publish src/DM_Helper.Wpf/DM_Helper.Wpf.csproj -c Release -r win-x64 --nologo -o out/app

      - name: Publish the Phase 0 verification tool
        working-directory: win
        run: dotnet publish src/DM_Helper.Spike/DM_Helper.Spike.csproj -c Release -r win-x64 --self-contained false --nologo -o out/spike

      - name: Verify the manifest reached the binary
        # A build can silently drop app.manifest, leaving the app unelevated and every
        # SendInput call quietly blocked by UIPI. Assert on the published exe.
        shell: pwsh
        run: |
          $exe = "out/app/DM_Helper.exe"
          if (-not (Test-Path $exe)) { throw "DM_Helper.exe was not produced" }

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text  = [System.Text.Encoding]::UTF8.GetString($bytes)

          foreach ($needle in @('requireAdministrator', 'PerMonitorV2')) {
            if (-not $text.Contains($needle)) {
              throw "manifest entry '$needle' is missing from the published exe - elevation or DPI awareness was dropped"
            }
          }

          Write-Host "manifest verified: requireAdministrator + PerMonitorV2 present"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: dm-helper-windows-x64
          path: win/out/app/**
          retention-days: 30

      - name: Upload verification tool
        uses: actions/upload-artifact@v4
        with:
          name: dm-helper-spike-windows-x64
          path: win/out/spike/**
          retention-days: 30

  # ---------------------------------------------------------------------------
  # macOS app build. Codesign and notarization are deliberately out of scope: the
  # published .app must be produced on a Mac holding the signing identity, which this
  # runner does not have. This job proves the ObjC still compiles.
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Build the Objective-C target
        # -target is used rather than -scheme because the repository contains no shared
        # .xcscheme file, so -scheme would depend on Xcode autocreating one on the runner.
        # The product name is DM_Helper even though the target is d3key; the setting lives
        # in the pbxproj as PRODUCT_NAME.
        #
        # No signing: a CI-signed build would not be distributable anyway, and it would
        # produce an artifact that differs from the released one in a confusing way.
        run: |
          set -euo pipefail
          xcodebuild \
            -project "D3 Skill Assistant.xcodeproj" \
            -target d3key \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Locate the built app
        id: app
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/dd" -name "DM_Helper.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::DM_Helper.app was not produced by the build"
            exit 1
          fi
          echo "path=$APP" >> "$GITHUB_OUTPUT"
          echo "found $APP"

      - name: Upload macOS build (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: dm-helper-macos-unsigned
          path: ${{ steps.app.outputs.path }}
          retention-days: 30
